services:
  postgres-db:
    image: postgres:18-alpine
    container_name: postgres_mpaz
    restart: always
    environment:
      POSTGRES_DB: mpazdb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: